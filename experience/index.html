<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayraffe Complex | Loading...</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../global.js"></script>
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

    <style>
        :root {
            /* STEAM CLASSIC */
            --ui-bg: #38413a;
            --ui-panel: #4b564d;
            --ui-border-light: #5d6a60;
            --ui-border-dark: #2a322c;
            --ui-input: #2a322c;
            --ui-accent: #c1c6ad;
            --ui-text: #d1d1d1;
            --btn-grad-top: #758276;
        }

        [data-theme="invincible"] {
            /* GDA MODE */
            --ui-bg: #ccab25;           /* Deep Black base */
        --ui-panel: #17a4f6;        /* Dark Grey panels */
        --ui-border-light: #2563eb; /* Suit Blue Piping */
        --ui-border-dark: #000000;  
        --ui-input: #000000;        
        --ui-accent: #ffffff;       /* Electric Yellow (Gloves/Logo) */
        --ui-text: #ffffff;
        --ui-olive-dark: #101827;
        --btn-grad: linear-gradient(to bottom, #1e3a8a 0%, #16213e 100%);
        --btn-play-grad: linear-gradient(to bottom, #3b82f6 0%, #1e3a8a 100%);
        }

            [data-theme="shucks"] {
    /* SHUCKS / VOID CORRUPTION MODE */
    --ui-bg: #0d0b0b;           /* Darker, almost reddish-black */
    --ui-panel: #1a1515;        /* Dark wood/rust panel */
    --ui-border-light: #4a0000; /* Dried blood border */
    --ui-border-dark: #000000;  
    --ui-input: #050000;        /* Deep void pits */
    --ui-accent: #ff0000;       /* Glitch Red / Blood */
    --ui-text: #8c8c8c;         /* Ash grey text */
    --btn-grad-top: #3d0000;    /* Crimson gradient top */
    }

    [data-theme="shucks"] .steam-window {
        background-image: url('assets/images/textures/Texture.jpg'); /* If you have a wood texture */
       background-blend-mode: multiply;
    }

        body { 
            background-color: var(--ui-bg); 
            font-family: "Tahoma", "Verdana", sans-serif; 
            color: var(--ui-text);
            font-size: 11px;
            transition: background-color 0.2s ease;
        }

        /* HARD BORDERS */
        .steam-window {
            background: var(--ui-panel);
            border: 1px solid var(--ui-border-dark);
            border-top: 1px solid var(--ui-border-light);
            border-left: 1px solid var(--ui-border-light);
            padding: 2px;
        }

        .steam-inset {
            background: var(--ui-input);
            border: 1px solid var(--ui-border-dark);
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* DYNAMIC BUTTONS */
        .steam-btn {
            background: linear-gradient(to bottom, var(--btn-grad-top) 0%, var(--ui-panel) 100%);
            border: 1px solid var(--ui-border-dark);
            border-top: 1px solid var(--ui-border-light);
            border-left: 1px solid var(--ui-border-light);
            color: white;
            padding: 4px 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
        }

        .steam-btn:active {
            background: var(--ui-input);
            border: 1px solid var(--ui-border-light);
            border-top: 1px solid var(--ui-border-dark);
        }

        /* Large Launch Button - Uses Accent Color for Suit/GDA */
        .steam-btn-large {
            background: linear-gradient(to bottom, var(--ui-accent) 0%, var(--ui-panel) 100%);
            border: 1px solid var(--ui-border-dark);
            color: #000; /* Dark text on bright launch button */
            padding: 10px 40px;
            font-size: 18px;
            font-weight: 900;
            font-style: italic;
        }
        
        [data-theme="steam"] .steam-btn-large { color: white; }

        h1 { color: #fff; text-shadow: 1px 1px 0px #000; }

        .steam-tab {
            padding: 5px 15px;
            background: var(--ui-panel);
            border: 1px solid var(--ui-border-dark);
            border-top: 1px solid var(--ui-border-light);
            border-left: 1px solid var(--ui-border-light);
            border-bottom: none;
            display: inline-block;
            margin-right: 2px;
            color: var(--ui-accent);
        }
    </style>
</head>
<body class="p-4">

    <nav class="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
        <a href="../homepage" class="font-bold text-white tracking-tight text-lg">
            JAYRAFFE COMPLEX <span class="text-xs opacity-50 font-normal">v1.22 (Moose Jayraffe)</span>
        </a>
        <div class="flex items-center gap-4">
            <div class="text-right">
                <span id="user-name" class="font-bold text-white">Guest User</span>
                <p id="user-rank" class="text-[9px] uppercase opacity-50">Not Connected</p>
            </div>
            <div id="user-avatar" class="w-8 h-8 steam-inset flex items-center justify-center">👤</div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto">
        
        <div class="steam-window mb-6">
            <div class="bg-[#323933] p-1 mb-1 text-[10px] font-bold uppercase px-2 text-slate-400">
                Live Interface Uplink // <span id="activity-tags">LOADING...</span>
            </div>
            <div class="relative bg-black aspect-video w-full steam-inset overflow-hidden">
                <div id="activity-container" class="w-full h-full flex items-center justify-center">
                    <div id="loading-ui" class="text-center">
                        <button id="start-btn" class="steam-btn steam-btn-large">
                            LAUNCH ACTIVITY
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            
            <div class="lg:col-span-2">
                <div class="steam-tab uppercase font-bold">Details</div>
                <div class="steam-window p-6 min-h-[200px]">
                    <h1 id="activity-title" class="text-4xl font-black italic uppercase mb-1">ACTIVITY TITLE</h1>
                    <p id="activity-creator" class="text-yellow-600 font-bold mb-4">DEV: UNKNOWN</p>
                    
                    <div class="h-px w-full bg-black/20 mb-4"></div>
                    
                    <p id="activity-desc" class="text-sm leading-relaxed text-slate-300">
                        Fetching sector data...
                    </p>

                    <div id="server-preview" class="hidden mt-6 p-3 steam-inset bg-[#2a322c]">
                        <p class="text-[10px] font-bold text-emerald-500 uppercase">Multiplayer detected: 0 Players Online</p>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="steam-tab uppercase font-bold">Preview</div>
                <div class="steam-window p-2">
                    <div class="steam-inset">
                        <img id="random-screenshot" src="" class="w-full h-auto grayscale-[0.5] hover:grayscale-0 transition duration-500">
                    </div>
                </div>
                
                <div class="flex gap-2">
                    <button id="fav-btn" onclick="toggleFavorite()" class="steam-btn flex-1 flex items-center justify-center gap-2">
                        <span id="fav-text">FAVORITE</span>
                    </button>
                    <button class="steam-btn flex-1">SHARE</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        let data = null;
        const params = new URLSearchParams(window.location.search);
        const activityId = params.get('id') || 'hl1';

        function initPage() {
            const library = window.activityLibrary;
            if (!library) return;
            data = library[activityId];

            if (data) {
                document.title = `Jayraffe Complex | ${data.title}`;
                document.getElementById('activity-title').innerText = data.title;
                document.getElementById('activity-creator').innerText = `DEVELOPER: ${data.creator.toUpperCase()}`;
                document.getElementById('activity-desc').innerText = data.desc;
                document.getElementById('activity-tags').innerText = data.tags;
                document.getElementById('random-screenshot').src = `../${data.screenshots[0]}`;
                
                if (data.engine === 'xash3d') {
                    document.getElementById('server-preview').classList.remove('hidden');
                }
            }
        }

        document.getElementById('start-btn').addEventListener('click', function () {
            const container = document.getElementById('activity-container');
            container.innerHTML = ''; 

            setInterval(() => { updatePresence(data.title); }, 30000);

            if (data.engine === 'Flash') {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                player.className = "w-full h-full";
                container.appendChild(player);
                player.load(`../assets/swfs/${data.config.filename}.swf`);
            } else if (data.engine === "JS-DOS") {
                container.innerHTML = '<div id="dos" class="w-full h-full"></div>';
                Dos(document.getElementById("dos"),{ url: (data.config.url), key: ("zgwvz"), kiosk: (true), autoStart: (true)});
            } else {
                const activityFrame = document.createElement('iframe');
                activityFrame.src = data.config.url;
                activityFrame.className = "w-full h-full border-0";
                activityFrame.allow = "autoplay; fullscreen; keyboard; activitypad; pointer-lock";
                container.appendChild(activityFrame);
            }
        });

        async function updatePresence(gameTitle) {
            const client = window.supabaseClient;
            if(!client) return;
            const { data: { user } } = await client.auth.getUser();
            if (user) {
                await client.from('presence').upsert({ 
                    user_id: user.id, 
                    last_seen: new Date().toISOString(),
                    current_activity: gameTitle 
                });
            }
        }

        async function syncUserStatus() {
            const client = window.supabaseClient;
            if(!client) return;
            const { data: { user } } = await client.auth.getUser();
            if (user) {
                document.getElementById('user-name').innerText = user.user_metadata?.display_name || user.email.split('@')[0];
                document.getElementById('user-rank').innerText = "Verified Citizen";
                if (user.user_metadata?.avatar_url) {
                    document.getElementById('user-avatar').innerHTML = `<img src="${user.user_metadata.avatar_url}" class="w-full h-full object-cover">`;
                }
                updatePresence(data.title); 
            }
        }

        window.addEventListener('message', (event) => {
    // Only accept messages that look like our theme updates
    if (event.data.type === 'THEME_UPDATE') {
        // This applies the theme to the <html> tag of the sub-page
        document.documentElement.setAttribute('data-theme', event.data.theme);
        
        // Also save it locally so if the iframe refreshes, it stays correct
        localStorage.setItem('jayraffe-theme', event.data.theme);
    }
});

// Check on initial load
(function() {
    const saved = localStorage.getItem('jayraffe-theme') || 'steam';
    document.documentElement.setAttribute('data-theme', saved);
})();

        window.addEventListener('load', () => {
            initPage();
            syncUserStatus();
        });
    </script>
</body>
</html>
