<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jayraffe Complex | Options</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../global.js"></script>
    <style>
        :root {
            --steam-bg: #3d463f;
            --steam-panel: #4b564d;
            --steam-border-light: #5d6a60;
            --steam-border-dark: #2a322c;
            --steam-input: #2a322c;
            --steam-text: #d1d1d1;
            --steam-yellow: #c1c6ad;
        }

        /* GDA & VOID THEMES */
        [data-theme="invincible"] {
            --steam-bg: #d7d949;
            --steam-panel: #00b8f5;
            --steam-border-light: #3f73e4;
            --steam-border-dark: #000000;
            --steam-input: #000000;
            --steam-text: #ffffff;
            --steam-yellow: #ffffff;
        }

        [data-theme="shucks"] {
            --steam-bg: #0d0b0b;
            --steam-panel: #1a1515;
            --steam-border-light: #4a0000;
            --steam-border-dark: #000000;
            --steam-input: #050000;
            --steam-accent: #ff0000;
            --steam-text: #8c8c8c;
            --steam-yellow: #ff0000;
        }

        [data-theme="shucks"] .settings-window {
            background-image: url('assets/images/textures/Texture.jpg');
            background-blend-mode: multiply;
        }

        body { 
            background-color: var(--steam-bg); 
            color: var(--steam-text);
            font-family: "Tahoma", "Verdana", sans-serif; 
            font-size: 11px;
            padding: 20px;
        }

        .settings-window {
            background: var(--steam-panel);
            border: 1px solid var(--steam-border-dark);
            border-top: 1px solid var(--steam-border-light);
            border-left: 1px solid var(--steam-border-light);
            width: 480px;
            margin: auto;
        }

        .tab-bar {
            display: flex;
            padding: 10px 10px 0 10px;
            gap: 2px;
        }

        .tab {
            padding: 4px 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--steam-border-dark);
            border-bottom: none;
            cursor: pointer;
            color: #888;
        }

        .tab.active {
            background: var(--steam-panel);
            color: white;
            border-top: 1px solid var(--steam-border-light);
            border-left: 1px solid var(--steam-border-light);
            margin-bottom: -1px;
            z-index: 10;
        }

        /* Account Lock Style */
        .tab.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .content-area {
            border: 1px solid var(--steam-border-dark);
            border-top: 1px solid var(--steam-border-light);
            border-left: 1px solid var(--steam-border-light);
            margin: 0 10px 10px 10px;
            padding: 20px;
            min-height: 250px;
        }

        .steam-input {
            background: var(--steam-input);
            border: 1px solid var(--steam-border-dark);
            border-right: 1px solid var(--steam-border-light);
            border-bottom: 1px solid var(--steam-border-light);
            color: #fff;
            padding: 4px 6px;
            width: 100%;
            outline: none;
        }

        .steam-btn {
            background: linear-gradient(to bottom, #5a665b 0%, #3d463f 100%);
            border: 1px solid var(--steam-border-dark);
            border-top: 1px solid var(--steam-border-light);
            border-left: 1px solid var(--steam-border-light);
            color: #fff;
            padding: 4px 15px;
            cursor: pointer;
        }

        .label-yellow { color: var(--steam-yellow); margin-bottom: 4px; display: block; font-weight: bold; }
    </style>
</head>
<body>

    <div class="settings-window">
        <div class="p-2 border-b border-black/20 flex justify-between items-center">
            <span class="font-bold text-white uppercase text-[10px]">Settings</span>
        </div>

        <div class="tab-bar">
            <div id="btn-general" class="tab active" onclick="showTab('general')">General</div>
            <div id="btn-account" class="tab" onclick="showTab('account')">Account</div>
            <div id="btn-interface" class="tab" onclick="showTab('interface')">Interface</div>
        </div>

        <div class="content-area">
            <div id="tab-general" class="tab-content space-y-4">
                <div>
                    <label class="label-yellow">Auto-Skip Intro?</label>
                    <input type="text" id="skip-intro" class="steam-input" placeholder="Off">
                </div>
            </div>

            <div id="tab-account" class="tab-content hidden space-y-4">
                <div>
                    <label class="label-yellow">Display Name</label>
                    <input type="text" id="set-username" class="steam-input">
                </div>
                <div>
                    <label class="label-yellow">Avatar URL</label>
                    <input type="text" id="set-avatar" class="steam-input">
                </div>
                <div class="pt-4 border-t border-black/20">
                    <button class="steam-btn opacity-50" disabled>Change Email...</button>
                </div>
            </div>

            <div id="tab-interface" class="tab-content hidden space-y-4">
                <label class="label-yellow">UI Uplink Mode</label>
                <select id="ui-theme-select" onchange="updateTheme(this.value)" class="steam-input bg-[#2a322c]">
                    <option value="steam">Classic Green</option>
                    <option value="invincible">Invincible Yellow</option>
                    <option value="shucks">Shucks Red</option>
                    <option value="atrain">A-Train Blue</option>
                </select>
                <p class="text-[10px] opacity-60 italic">Theme changes sync instantly with the main console.</p>
            </div>
        </div>

        <div class="p-3 bg-black/10 flex justify-end gap-2">
            <button onclick="saveSettings()" class="steam-btn">OK</button>
            <button onclick="window.close()" class="steam-btn">Cancel</button>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            const btn = document.getElementById('btn-' + tabName);
            if (btn.classList.contains('disabled')) return;

            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            btn.classList.add('active');
        }

        function updateTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('jayraffe-theme', theme);
            
            // Send to parent window
            if (window.opener) {
                window.opener.postMessage({ type: 'THEME_UPDATE', theme: theme }, '*');
            }
        }

        async function checkAuth() {
            const client = window.supabaseClient;
            if (!client) return;

            const { data: { user } } = await client.auth.getUser();
            const accountBtn = document.getElementById('btn-account');

            if (!user) {
                accountBtn.classList.add('disabled');
                accountBtn.title = "Account tab requires login";
            } else {
                loadCurrentSettings(user);
            }
        }

        async function loadCurrentSettings(user) {
            const client = window.supabaseClient;
            const { data: profile } = await client
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                document.getElementById('set-username').value = profile.display_name || '';
                document.getElementById('set-avatar').value = profile.avatar_url || '';
            }
        }

        async function saveSettings() {
    const client = window.supabaseClient;
    
    // Save the Auto-Skip preference locally
    const skipValue = document.getElementById('skip-intro').value.toLowerCase();
    if (skipValue === 'on' || skipValue === 'yes' || skipValue === 'true') {
        localStorage.setItem('auto-skip-intro', 'true');
    } else {
        localStorage.setItem('auto-skip-intro', 'false');
    }

    // Existing Supabase Profile logic
    const { data: { user } } = await client.auth.getUser();
    if(user) {
        const updates = {
            display_name: document.getElementById('set-username').value,
            avatar_url: document.getElementById('set-avatar').value,
        };
        await client.from('profiles').update(updates).eq('id', user.id);
    }
    
    window.close();
}
        // Init
        (function() {
            const saved = localStorage.getItem('jayraffe-theme') || 'steam';
            document.documentElement.setAttribute('data-theme', saved);
            document.getElementById('ui-theme-select').value = saved;
            const isSkipping = localStorage.getItem('auto-skip-intro') === 'true';
    document.getElementById('skip-intro').value = isSkipping ? 'On' : 'Off';
            checkAuth();
        })();
    </script>
</body>
</html>
