<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Juno Player</title>
</head>
<body style="background: #121212; color: white; font-family: sans-serif; padding: 40px;">

    <h2>Sabrina Stream Test (Firewall Proof) ☕</h2>
    <button onclick="playSong()">Play Espresso</button>
    
    <div id="track-info" style="margin-top: 20px;"></div>
    <audio id="audio-player" controls style="margin-top: 20px; display: block;"></audio>

<script>
    // Update this line to use your live operational Render backend link
    const BACKEND_URL = "https://junostreaming-api.onrender.com"; 

    async function playSong() {
        const player = document.getElementById('audio-player');
        const infoDiv = document.getElementById('track-info');
        infoDiv.innerText = "Querying your live cloud backend... ☕";

        try {
            // 1. Search via your unblocked cloud domain
            const response = await fetch(`${BACKEND_URL}/api/search?q=Sabrina+Carpenter+Espresso`);
            const data = await response.json();
            
            if (data.length > 0) {
                const track = data[0];
                infoDiv.innerHTML = `Now Playing: <b>${track.name}</b>`;
                
                // 2. Stream the bytes disguised directly through your server pipeline
                player.src = `${BACKEND_URL}/api/stream?id=${track.videoId}`;
                player.play();
            } else {
                infoDiv.innerText = "Track matching failed.";
            }
        } catch (err) {
            console.error(err);
            infoDiv.innerText = "Could not connect to the cloud server engine.";
        }
    }
</script>
</body>
</html>
