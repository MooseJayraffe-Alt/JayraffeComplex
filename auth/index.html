<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayraffe Complex | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../global.js"></script>

    <style>
        :root {
            /* STEAM CLASSIC (Default Colors) */
            --steam-bg: #3d463f;
            --steam-panel: #4b564d;
            --steam-border-light: #5d6a60;
            --steam-border-dark: #2a322c;
            --steam-input: #2a322c;
            --steam-text: #d1d1d1;
            --steam-yellow: #c1c6ad;
            --steam-header: #343d36;
        }

        /* THEME: INVINCIBLE (GDA Colors) */
        [data-theme="invincible"] {
            --steam-bg: #17a8f6;
            --steam-panel: #ccab25;
            --steam-border-light: #fbe068;
            --steam-border-dark: #8c730e;  
            --steam-input: #111827;        
            --steam-yellow: #17a8f6;
            --steam-text: #ffffff;
            --steam-header: #b5951d;
        }

        /* THEME: A-TRAIN */
        [data-theme="atrain"] {
            --steam-bg: #0b162a;
            --steam-panel: #1d6ef8;
            --steam-border-light: #5ba2ff;
            --steam-border-dark: #003fa3;  
            --steam-input: #02050a;        
            --steam-yellow: #32f5ff;
            --steam-text: #ffffff;
            --steam-header: #1052c7;
        }

        /* THEME: SHUCKS */
        [data-theme="shucks"] {
            --steam-bg: #0d0b0b;
            --steam-panel: #1a1515;
            --steam-border-light: #5c0a0a;
            --steam-border-dark: #000000;  
            --steam-input: #050000;        
            --steam-yellow: #ff0000;
            --steam-text: rgb(255, 255, 255);
            --steam-header: #2b0505;
        }

        body { 
            background-color: var(--steam-bg); 
            color: var(--steam-text);
            font-family: "Tahoma", "Verdana", sans-serif; 
            font-size: 11px;
            transition: background-color 0.3s ease;
        }

        .steam-window {
            background: var(--steam-panel);
            border: 1px solid var(--steam-border-dark);
            border-top: 1px solid var(--steam-border-light);
            border-left: 1px solid var(--steam-border-light);
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.1), 3px 3px 10px rgba(0,0,0,0.5);
        }

        .title-bar {
            background: var(--steam-header);
            border-bottom: 1px solid var(--steam-border-dark);
        }

        .steam-input {
            background: var(--steam-input);
            border: 1px solid var(--steam-border-dark);
            border-top: 1px solid rgba(0,0,0,0.3);
            border-left: 1px solid rgba(0,0,0,0.3);
            border-right: 1px solid var(--steam-border-light);
            border-bottom: 1px solid var(--steam-border-light);
            color: #fff;
            padding: 5px 6px;
            outline: none;
            width: 100%;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.4);
        }

        .steam-input:focus {
            border: 1px solid var(--steam-yellow);
        }

        .steam-btn {
            background: linear-gradient(to bottom, var(--steam-border-light) 0%, var(--steam-panel) 100%);
            border: 1px solid var(--steam-border-dark);
            border-top: 1px solid var(--steam-border-light);
            border-left: 1px solid var(--steam-border-light);
            color: #fff;
            padding: 4px 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 10px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.4);
        }

        .steam-btn:active {
            border: 1px solid var(--steam-border-light);
            border-top: 1px solid var(--steam-border-dark);
            border-left: 1px solid var(--steam-border-dark);
            background: var(--steam-input);
        }

        .label-yellow {
            color: var(--steam-yellow);
            text-align: right;
            padding-right: 12px;
            font-size: 11px;
        }

        .steam-hr {
            border: 0;
            border-top: 1px solid var(--steam-border-dark);
            border-bottom: 1px solid var(--steam-border-light);
            margin: 16px 0;
        }

        .link-style {
            color: var(--steam-text);
            text-decoration: underline;
            cursor: pointer;
            font-size: 10px;
        }

        .link-style:hover { color: #fff; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="steam-window w-[440px] p-[2px]">
        <div class="title-bar px-3 py-1.5 flex justify-between items-center text-white font-bold text-[11px] tracking-wide uppercase">
            <span>System Authentication</span>
            <span class="opacity-30 font-mono text-[9px]">v2.5_FLEXAUTH</span>
        </div>

        <div class="p-4 space-y-4">
            <div class="flex gap-2 mb-2 items-center">
                <button onclick="setAuthMode('login')" id="tab-login" class="text-[10px] text-white font-bold tracking-wider border-b-2 border-white/80 pb-0.5">LOGIN</button>
                <span class="opacity-20 text-xs">|</span>
                <button onclick="setAuthMode('signup')" id="tab-signup" class="text-[10px] text-white font-bold tracking-wider opacity-40 pb-0.5 hover:opacity-80">SIGNUP</button>
            </div>

            <div class="grid grid-cols-3 items-center gap-y-3.5">
                
                <label id="label-primary" class="label-yellow col-span-1 font-bold">Account / Email</label>
                <div class="col-span-2">
                    <input type="text" id="primary-input" class="steam-input" placeholder="Username or Email address...">
                </div>

                <label id="label-username" class="label-yellow col-span-1 font-bold hidden">Choose Handle</label>
                <div class="col-span-2 hidden" id="container-username">
                    <input type="text" id="username-input" class="steam-input uppercase text-xs font-mono" placeholder="CITIZEN ALIAS...">
                    <div class="text-[9px] opacity-40 mt-1 italic">Optional: Leave Account/Email blank above if you don't want to attach an email.</div>
                </div>

                <label class="label-yellow col-span-1 font-bold">Password</label>
                <div class="col-span-2">
                    <input type="password" id="password-input" class="steam-input">
                </div>

                <div class="col-start-2 col-span-2 flex items-center gap-2 mt-0.5">
                    <input type="checkbox" id="remember" class="accent-neutral-700 w-3 h-3">
                    <label for="remember" class="text-[10px] select-none opacity-80">Remember my account credentials</label>
                </div>
            </div>

            <div class="flex justify-start gap-2 pt-2 ml-[33.3%]">
                <button id="auth-submit" onclick="handleAuth()" class="steam-btn">Login</button>
                <button onclick="window.location.href='../homepage'" class="steam-btn">Cancel</button>
            </div>

            <hr class="steam-hr">

            <div class="grid grid-cols-3 gap-y-2 text-[10px]">
                <span class="text-right pr-3 opacity-40 font-bold uppercase tracking-wider text-[9px]">New User:</span>
                <span class="col-span-2 link-style font-medium" onclick="setAuthMode('signup')">Create a new mainframe security account...</span>
                
                <span class="text-right pr-3 opacity-40 font-bold uppercase tracking-wider text-[9px]">Recovery:</span>
                <span class="col-span-2 link-style font-medium">Reset credential access pathways...</span>
            </div>
        </div>
    </div>

    <script>
        let mode = 'login';
        const INTERNAL_DOMAIN = 'internal.complex';

        // --- THEME ENGINE LOADING ---
        window.addEventListener('message', (event) => {
            if (event.data.type === 'THEME_UPDATE') {
                document.documentElement.setAttribute('data-theme', event.data.theme);
                localStorage.setItem('jayraffe-theme', event.data.theme);
            }
        });
        (function() {
            const saved = localStorage.getItem('jayraffe-theme') || 'steam';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        function setAuthMode(newMode) {
            mode = newMode;
            const uInput = document.getElementById('container-username');
            const uLabel = document.getElementById('label-username');
            const primaryLabel = document.getElementById('label-primary');
            const primaryInput = document.getElementById('primary-input');
            const submitBtn = document.getElementById('auth-submit');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            
            if (mode === 'signup') {
                uInput.classList.remove('hidden');
                uLabel.classList.remove('hidden');
                primaryLabel.innerText = "Email (Optional)";
                primaryInput.placeholder = "Enter email if you want recovery access...";
                submitBtn.innerText = "Create Account";
                tabSignup.className = "text-[10px] text-white font-bold tracking-wider border-b-2 border-white/80 pb-0.5";
                tabLogin.className = "text-[10px] text-white font-bold tracking-wider opacity-40 pb-0.5 hover:opacity-80";
            } else {
                uInput.classList.add('hidden');
                uLabel.classList.add('hidden');
                primaryLabel.innerText = "Account / Email";
                primaryInput.placeholder = "Username or Email address...";
                submitBtn.innerText = "Login";
                tabLogin.className = "text-[10px] text-white font-bold tracking-wider border-b-2 border-white/80 pb-0.5";
                tabSignup.className = "text-[10px] text-white font-bold tracking-wider opacity-40 pb-0.5 hover:opacity-80";
            }
        }

        async function handleAuth() {
            const client = window.supabaseClient;
            if (!client) {
                alert("System Error: Supabase connection not found.");
                return;
            }

            const primaryValue = document.getElementById('primary-input').value.trim();
            const password = document.getElementById('password-input').value;
            const chosenUsername = document.getElementById('username-input').value.trim();

            if (!password) {
                alert("Authentication Failed: Password field cannot be empty.");
                return;
            }

            // ==========================================
            // LOGIC BRANCH: SIGN UP SEQUENCE
            // ==========================================
            if (mode === 'signup') {
                let finalEmail = primaryValue;
                let finalUsername = chosenUsername;

                // Scenario A: User wants a completely email-less account
                if (!primaryValue) {
                    if (!chosenUsername) {
                        alert("Registration Failed: You must provide a Username if no email is attached.");
                        return;
                    }
                    // Map handle to our internal clean system domain structure
                    finalEmail = `${chosenUsername.toLowerCase()}@${INTERNAL_DOMAIN}`;
                } else {
                    // Scenario B: User provided an email in the top box, check if they forgot a username
                    if (!primaryValue.includes('@')) {
                        alert("Registration Failed: Please provide a structurally valid email or leave it empty.");
                        return;
                    }
                    if (!chosenUsername) {
                        // Fallback: use the first half of their email as username if they left it empty
                        finalUsername = primaryValue.split('@')[0];
                    }
                }

                // 1. Length Checking Rules
                if (finalUsername.length < 3 || finalUsername.length > 15) {
                    alert("Registration Rejected: Username must be between 3 and 15 characters long.");
                    return;
                }

                // 2. Vector Moderation Verification Link
                try {
                    const res = await fetch('https://vector.profanity.dev', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: finalUsername }), 
                    });
                    const filterResult = await res.json();
                    if (filterResult.isProfane) {
                        alert("Registration Rejected: This username contains inappropriate content.");
                        return;
                    }
                } catch (apiError) {
                    console.error("Moderation check failed:", apiError);
                    const backupBlock = ['admin', 'system', 'mod', 'jayraffe', 'jun0', 'staff'];
                    if (backupBlock.some(word => finalUsername.toLowerCase().includes(word))) {
                        alert("Registration Rejected: Restricted alias system configuration.");
                        return;
                    }
                }

                // 3. Commit Account to Supabase Central Database
                const { error } = await client.auth.signUp({
                    email: finalEmail, 
                    password, 
                    options: { data: { display_name: finalUsername } }
                });
                
                if (error) alert(error.message);
                else alert("Account Created! System access established.");

            // ==========================================
            // LOGIC BRANCH: SIGN IN SEQUENCE
            // ==========================================
            } else {
                if (!primaryValue) {
                    alert("Authentication Failed: Account field required.");
                    return;
                }

                let targetLoginEmail = primaryValue;

                // If no '@' is found, treat input as a custom username profile match
                if (!primaryValue.includes('@')) {
                    targetLoginEmail = `${primaryValue.toLowerCase()}@${INTERNAL_DOMAIN}`;
                }

                const { error } = await client.auth.signInWithPassword({ 
                    email: targetLoginEmail, 
                    password 
                });

                if (error) alert(error.message);
                else window.location.href = "../homepage";
            }
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAuth();
        });
    </script>
</body>
</html>
