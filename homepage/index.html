<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../styles.css">
    <script src="../global.js"></script>
    
    <title>Jayraffe Complex | Archives</title>

    <style>
    :root {
        /* STEAM CLASSIC (Default Colors) */
        --ui-bg: #38413a;
        --ui-panel: #4b564d;
        --ui-border-light: #5d6a60;
        --ui-border-dark: #2a322c;
        --ui-input: #2a322c;
        --ui-text: #d1d1d1;
        --ui-accent: #c1c6ad;
        --ui-olive-dark: #3d463f;
        --btn-grad: linear-gradient(to bottom, #75826b 0%, #5a6651 100%);
        --btn-play-grad: linear-gradient(to bottom, #a4ad8d 0%, #6b7754 100%);
    }

    /* THEME: INVINCIBLE (GDA Colors) */
    [data-theme="invincible"] {
       --ui-bg: #17a8f6;           /* Deep Black base */
        --ui-panel: #ccab25;        /* Dark Grey panels */
        --ui-border-light: #2563eb; /* Suit Blue Piping */
        --ui-border-dark: #000000;  
        --ui-input: #000000;        
        --ui-accent: #46b2ff;       /* Electric Yellow (Gloves/Logo) */
        --ui-text: #ffffff;
        --ui-olive-dark: #101827;
        --btn-grad: linear-gradient(to bottom, #1e3a8a 0%, #16213e 100%);
        --btn-play-grad: linear-gradient(to bottom, #3b82f6 0%, #1e3a8a 100%);
    }

    [data-theme="shucks"] {
    /* SHUCKS / VOID CORRUPTION MODE */
    --ui-bg: #0d0b0b;           /* Darker, almost reddish-black */
    --ui-panel: #1a1515;        /* Dark wood/rust panel */
    --ui-border-light: #4a0000; /* Dried blood border */
    --ui-border-dark: #000000;  
    --ui-input: #050000;        /* Deep void pits */
    --ui-accent: #ff0000;       /* Glitch Red / Blood */
    --ui-text: rgb(255, 255, 255);
    --ui-olive-dark: #ff00004b;       /* Ash grey text */
    --btn-grad-top: #3d0000;    /* Crimson gradient top */
    --btn-grad: linear-gradient(to bottom, #ff0000 0%, #4a0000 100%);
        --btn-play-grad: linear-gradient(to bottom, #ff0000 0%, #4a0000 100%);
}

/* Specific Shucks Flare: Adding a blood-red glow to the accent text */
[data-theme="shucks"] #activity-tags, 
[data-theme="shucks"] #activity-title {
    color: #ff0000;
    text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
}

    body {
        background-color: var(--ui-bg);
        color: var(--ui-text);
        font-family: "Tahoma", sans-serif; 
        margin: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        font-size: 11px;
        height: 100vh;
        overflow: hidden;
        transition: background-color 0.3s ease;
    }

    /* --- NETWORK AREA --- */
    .network-area {
        background: var(--ui-olive-dark);
        border: 1px solid var(--ui-border-dark);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-shrink: 0;
    }

    .graph-container {
        width: 300px;
        height: 50px;
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.05);
        position: relative;
        overflow: hidden;
    }

    .graph-line {
        position: absolute;
        bottom: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(193, 198, 173, 0.1) 21px);
        border-bottom: 2px solid var(--ui-accent);
        clip-path: polygon(0% 80%, 15% 40%, 30% 60%, 45% 20%, 60% 70%, 75% 30%, 90% 50%, 100% 40%, 100% 100%, 0% 100%);
    }

    /* --- ARCHIVE LIST LAYOUT (The fix is here) --- */
    .archive-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
        flex-grow: 1;
        margin-bottom: 45px;
        padding-right: 5px;
        opacity: 0;
        transition: opacity 0.5s ease;
    }

    .archive-entry {
        background: var(--ui-panel);
        border: 1px solid var(--ui-border-dark);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        padding: 8px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .entry-thumb { 
        width: 120px; 
        height: 45px; 
        object-fit: cover; 
        border: 1px solid #000; 
        flex-shrink: 0; 
    }

    .entry-info { 
        flex-grow: 1; /* This pushes the PLAY button to the right */
    }

    .entry-title { 
        font-weight: bold; 
        color: #fff; 
        font-size: 13px; 
        margin: 0; 
    }

    .entry-status { 
        color: var(--ui-accent); 
        opacity: 0.7; 
        font-size: 10px; 
        text-transform: uppercase; 
    }

    .btn-play {
        background: var(--btn-play-grad);
        border: 1px solid var(--ui-border-dark);
        color: white;
        padding: 4px 20px;
        font-weight: bold;
        cursor: pointer;
        text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        flex-shrink: 0; /* Prevents the button from being squashed */
    }

    /* --- INTRO & OVERLAYS --- */
    #intro-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 9999; background: black; display: flex;
        align-items: center; justify-content: center; overflow: hidden;
    }

    .terminal-text {
        font-family: "Courier New", Courier, monospace;
        color: var(--ui-accent);
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 0 0 8px rgba(193, 198, 173, 0.6);
        animation: flicker 2s infinite;
        text-align: center;
    }

    .steam-btn-classic {
        background: var(--btn-grad);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        border-right: 1px solid var(--ui-border-dark);
        border-bottom: 1px solid var(--ui-border-dark);
        color: var(--ui-text);
        font-family: "Tahoma", sans-serif;
        font-size: 10px;
        font-weight: bold;
        padding: 6px 14px;
        cursor: pointer;
    }

    /* --- FOOTER & INPUTS --- */
    .footer-bar {
        position: fixed; bottom: 0; left: 0; right: 0; height: 35px;
        background: var(--ui-panel);
        border-top: 1px solid var(--ui-border-light);
        display: flex; align-items: center; padding: 0 20px; gap: 20px;
    }

    .progress-container {
        flex-grow: 1; height: 10px;
        background: var(--ui-input);
        border: 1px solid var(--ui-border-dark);
        position: relative;
    }

    #sync-progress {
        width: 0%; height: 100%;
        background: var(--ui-accent);
        transition: width 0.1s linear;
    }

    .steam-input {
        background: var(--ui-input);
        border: 1px solid var(--ui-border-dark);
        color: var(--ui-accent);
        padding: 6px 10px; width: 100%; outline: none; margin-bottom: 10px;
    }

    /* SCROLLBARS */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: var(--ui-input); }
    ::-webkit-scrollbar-thumb { 
        background: var(--ui-panel); 
        border: 1px solid var(--ui-border-dark); 
    }

    @keyframes flicker { 0%, 100% { opacity: 1; } 92% { opacity: 1; } 94% { opacity: 0.6; } 98% { opacity: 0.3; } }
</style>
</head>
<body>

   <div id="intro-overlay">
        <video id="intro-video" style="width: 100%; height: 100%; object-fit: cover;">
           <source src="../assets/videos/ShuckIntro.mp4" type="video/mp4">
        </video>
        
        <button onclick="skipIntro()" class="steam-btn-classic" style="position: absolute; bottom: 40px; right: 40px; z-index: 10000;">
            SKIP INTRO [ESC]
        </button>
    </div>

    <div class="network-area">
        <div>
            <p class="m-0 uppercase font-bold text-[9px] opacity-60">Network Usage</p>
            <h1 id="net-speed" class="m-0 text-white text-2xl font-black italic">0.0 MB/S</h1>
            <p class="m-0 text-emerald-500 font-mono text-[9px]"><span id="live-counter">0</span> CITIZENS ONLINE</p>
        </div>
        <div class="graph-container">
            <div id="graph-line" class="graph-line"></div>
        </div>
    </div>

    <input type="text" id="searchBar" placeholder="Filter Archives..." class="steam-input" onkeyup="filterArchives()">
    <div class="archive-list" id="archive-list"></div>

    <div class="footer-bar">
        <span id="sync-label" class="font-bold uppercase text-[9px] text-white">Connecting...</span>
        <div class="progress-container">
            <div id="sync-progress"></div>
        </div>
    </div>

    <script>
        // ... (Your existing archive array and simulation functions stay the same) ...
        const archives = [
            { title: 'Bendy and the Ink Machine', status: 'Ready to Play', img: '../assets/images/BendyThumbnail.jpg', url: '../experience/?id=bendy' },
        //    { title: 'Cuphead', status: 'Ready to Play', img: '../assets/images/CupheadThumbnail.avif', url: '../experience/?id=cuphead' },
        //    { title: 'DOOM', status: 'Ready to Play', img: '../assets/images/DoomThumbnail.webp', url: '../experience/?id=doom' },
            { title: 'Doors for Larpers', status: 'Ready to Play (for larpers btw)', img: '../assets/images/doorsforlarpers.webp', url: '../experience/?id=doorsfake' },
            { title: 'Friday Night Funkin: JCX Engine', status: 'Ready to Play', img: '../assets/images/FridayNightFunkinThumbnail.jpg', url: '../experience/?id=fnf' },
            { title: 'Friday Night Funkin: SHUCKS', status: 'Ready to Play', img: '../assets/images/Shucks.jpg', url: '../experience/?id=irida' },
            { title: 'Friday Night Funkin: Twiddlefingers', status: 'Ready to Play', img: '../assets/images/TwiddlefingersThumbnail.jpg', url: '../experience/?id=twiddlefingers' },
        //    { title: "Garry's Mod (10)", status: 'Update Required (Windows only.)', img: '../assets/images/GMOD.jpg', url: 'https://archive.org/download/mjayraffecomplexdirect/GMod10.7z' },
        //    { title: 'Half-Life 1', status: 'Update Required (Windows only.)', img: '../assets/images/HL1Thumbnail.jpg', url: 'https://archive.org/download/mjayraffecomplexdirect/Half-Life.7z' },
            { title: 'Half-Life 1', status: 'Update Required (Windows only)', img: '../assets/images/HL1Thumbnail.jpg', url: 'https://github.com/MooseJayraffe-Alt/JayraffeComplex/releases/download/Games/Half-Life.7z' },
            { title: 'Henry Stickmin: Breaking the Bank', status: 'Ready to Play', img: '../assets/images/BtBRTitle.webp', url: '../experience?id=btb' },
            { title: 'Henry Stickmin: Escaping the Prison', status: 'Ready to Play', img: '../assets/images/ETP.jpg', url: '../experience?id=etp' },
            { title: 'Henry Stickmin: Fleeing the Complex', status: 'Ready to Play', img: '../assets/images/HenryStickminETCThumbnail.avif', url: '../experience?id=etc' },
            { title: 'Henry Stickmin: Infiltrating the Airship', status: 'Ready to Play', img: '../assets/images/ItARTitle.webp', url: '../experience?id=ita' },
            { title: 'Henry Stickmin: Stealing the Diamond', status: 'Ready to Play', img: '../assets/images/StDRTitle.webp', url: '../experience?id=hsdiamond' },
        //    { title: 'Hello Neighbor (Alpha 1)', status: 'Update Required (Windows only.)', img: '../assets/images/HL1Thumbnail.jpg', url: 'https://archive.org/download/hello-neighbor-pre-alpha.-7z/Hello%20Neighbor%20Alpha%201.7z' },
        //    { title: 'ghst', status: 'Update Required (Windows only.)', img: '../assets/images/HL1Thumbnail.jpg', url: 'https://s3.amazonaws.com/ghst/g/index.html' },
            { title: 'Hollow Knight', status: 'Ready to Play', img: '../assets/images/HollowKnightThumbnail.png', url: '../experience/?id=hk' },
            { title: 'TSB for Larpers', status: 'Ready to Play (for frauds btw)', img: '../assets/images/tsbforlarpersthumbnail.jpg', url: '../experience/?id=faketsb' },
        //    { title: 'Team Fortress 2', status: 'Update Required (Windows only.)', img: '../assets/images/tf2.jpg', url: 'https://archive.org/download/mjayraffecomplexdirect/Team%20Fortress%202.7z' }, https://fnf.kdata1.com/2024/shucks-v2-reconstruction/1/
            { title: 'ULTRAKILL', status: 'Coming Soon..', img: '../assets/images/UltrakillThumbnail.jpg', url: '' },
        ];

        const introOverlay = document.getElementById('intro-overlay');
        const introVideo = document.getElementById('intro-video');

        function startIntro() {
            // Attempt to play (usually starts muted/fails first)
            introVideo.play().catch(() => showUplinkPrompt());
        }

        function showUplinkPrompt() {
    if (document.getElementById('play-prompt')) return;

    introOverlay.insertAdjacentHTML('afterbegin', `
        <div id="play-prompt">
            <div class="terminal-text">[ ACCESS RESTRICTED ]</div>
            <p class="terminal-text" style="font-size: 11px; margin-top: 15px; opacity: 0.8;">
                Click to Initialize Uplink
            </p>
        </div>
    `);

    document.getElementById('play-prompt').onclick = function() {
        console.log("Uplink Engaged: Unmuting Audio...");
        
        // 1. Remove the prompt
        this.remove(); 
        
        // 2. THE CRITICAL FIX: Toggle muted and volume together
        introVideo.muted = false;
        introVideo.volume = 1.0; 
        
        // 3. Restart the video so the user hears the beginning of the intro
        introVideo.currentTime = 0; 


        // Event: Video ends naturally
introVideo.onended = () => {
    console.log("Cinematic complete. Transitioning to Archives...");
    skipIntro();
};
        
        // 4. Re-call play (this 'unlocks' the audio context)
        const playPromise = introVideo.play();
        
        if (playPromise !== undefined) {
            playPromise.then(_ => {
                console.log("Audio successful.");
            }).catch(error => {
                console.error("Playback failed:", error);
            });
        }
    };
}
        function skipIntro() {
            introVideo.pause();
            introOverlay.style.transition = "opacity 0.8s ease";
            introOverlay.style.opacity = "0";
            setTimeout(() => introOverlay.remove(), 800);
        }

        (function() {
        const autoSkip = localStorage.getItem('auto-skip-intro') === 'true';
        const video = document.getElementById('intro-video');

        if (autoSkip) {
            // Setting is ON: Kill the overlay immediately
            skipIntro();
            console.log("Jayraffe Complex // Intro bypassed by user preference.");
        } else {
            // Setting is OFF: Play normally
            if (video) {
                video.play().catch(e => console.log("Autoplay blocked: User must click first."));
                
                // Hide overlay automatically when video ends
                video.onended = skipIntro;
            }
        }
    })();

        // Standard helpers
        function renderArchives() {
            const list = document.getElementById('archive-list');
            list.innerHTML = archives.map(item => `
                <div class="archive-entry">
                    <img src="${item.img}" class="entry-thumb">
                    <div class="entry-info">
                        <p class="entry-title">${item.title}</p>
                        <p class="entry-status">${item.status}</p>
                    </div>
                    <button onclick="window.location.href='${item.url}'" class="btn-play">PLAY</button>
                </div>
            `).join('');
        }

        function simulateSync() {
            let progress = 0;
            const bar = document.getElementById('sync-progress');
            const label = document.getElementById('sync-label');
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    label.innerText = "Sync Complete";
                    document.getElementById('archive-list').style.opacity = "1";
                    renderArchives();
                }
                bar.style.width = progress + "%";
                if (progress > 10 && progress < 90) label.innerText = "Syncing Archives...";
            }, 80);
        }

        window.onload = () => {
            simulateSync();
            startIntro();
            setInterval(updateLiveStats, 2000);
        };

        // Esc Key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('intro-overlay')) skipIntro();
        });

        // Other UI logic...
        function updateLiveStats() {
            const speed = (Math.random() * (3.5 - 2.1) + 2.1).toFixed(1);
            document.getElementById('net-speed').innerText = `${speed} MB/S`;
        }

        function filterArchives() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let entries = document.getElementsByClassName('archive-entry');
            for (let i = 0; i < entries.length; i++) {
                let title = entries[i].querySelector('.entry-title').innerText.toLowerCase();
                entries[i].style.display = title.includes(input) ? "flex" : "none";
            }
        }
        

      window.addEventListener('message', (event) => {
    // Only accept messages that look like our theme updates
    if (event.data.type === 'THEME_UPDATE') {
        // This applies the theme to the <html> tag of the sub-page
        document.documentElement.setAttribute('data-theme', event.data.theme);
        
        // Also save it locally so if the iframe refreshes, it stays correct
        localStorage.setItem('jayraffe-theme', event.data.theme);
    }
});

// Check on initial load
(function() {
    const saved = localStorage.getItem('jayraffe-theme') || 'steam';
    document.documentElement.setAttribute('data-theme', saved);
})();

    </script>
</body>
</html>
