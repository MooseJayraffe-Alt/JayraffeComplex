<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Juno Player</title>
</head>
<body style="background: #121212; color: white; font-family: sans-serif; padding: 40px;">

    <h2>Sabrina Stream Test (Cobalt Engine) ☕</h2>
    <button onclick="playSong()">Play Espresso</button>
    
    <div id="track-info" style="margin-top: 20px;"></div>
    <audio id="audio-player" controls style="margin-top: 20px; display: block;"></audio>

    <script>
    const BACKEND_URL = "https://junostreaming-api.onrender.com"; 

    async function playSong() {
        const player = document.getElementById('audio-player');
        const infoDiv = document.getElementById('track-info');
        infoDiv.innerText = "Searching YouTube Music database... ☕";

        try {
            // 1. Send query to our unblocked search api
            const response = await fetch(`${BACKEND_URL}/api/search?q=Sabrina+Carpenter+Espresso`);
            const tracks = await response.json();
            
            // SAFETY INTERCEPT: If the backend sent an error object instead of an array, handle it cleanly
            if (!Array.isArray(tracks) || tracks.length === 0) {
                console.error("Server Response Error Layout:", tracks);
                infoDiv.innerText = `Error: ${tracks.error || "No matching items found."}`;
                return;
            }

            const track = tracks[0];
            infoDiv.innerHTML = `Extracting audio for: <b>${track.name}</b> by ${track.artist}`;

            // 2. Safely call the public Cobalt conversion pipeline
            const cobaltResponse = await fetch("https://api.cobalt.tools/api/json", {
                method: "POST",
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: track.url,
                    audioModeOnly: true
                })
            });

            const cobaltData = await cobaltResponse.json();

            if (cobaltData.status === "stream" || cobaltData.url) {
                // 3. Mount the clear media asset straight into the browser layout
                player.src = cobaltData.url;
                player.play();
                infoDiv.innerHTML = `🎵 Now Playing: <b>${track.name}</b>`;
            } else {
                infoDiv.innerText = "Cobalt stream processing error. Try again.";
            }

        } catch (err) {
            console.error("Frontend exception caught:", err);
            infoDiv.innerText = "Network routing failure or server connection timeout.";
        }
    }
</script>
</body>
</html>
