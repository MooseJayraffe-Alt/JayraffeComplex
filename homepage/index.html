<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../styles.css">
    <script src="../global.js"></script>
    
    <title>Jayraffe Complex | Archives</title>

    <style>
    :root {
        /* STEAM CLASSIC (Default Colors) */
        --ui-bg: #38413a;
        --ui-panel: #4b564d;
        --ui-border-light: #5d6a60;
        --ui-border-dark: #2a322c;
        --ui-input: #2a322c;
        --ui-text: #d1d1d1;
        --ui-accent: #c1c6ad;
        --ui-olive-dark: #3d463f;
        --btn-grad: linear-gradient(to bottom, #75826b 0%, #5a6651 100%);
        --btn-play-grad: linear-gradient(to bottom, #a4ad8d 0%, #6b7754 100%);
    }

    /* THEME: INVINCIBLE (GDA Colors) */
    [data-theme="invincible"] {
        --ui-bg: #ffd325;           
        --ui-panel: #17a8f6;        
        --ui-border-light: #2563eb; 
        --ui-border-dark: #000000;  
        --ui-input: #000000;        
        --ui-accent: #ffffff;       
        --ui-text: #ffffff;
        --ui-olive-dark: #101827;
        --btn-grad: linear-gradient(to bottom, #1e3a8a 0%, #16213e 100%);
        --btn-play-grad: linear-gradient(to bottom, #3b82f6 0%, #1e3a8a 100%);
    }

    [data-theme="atrain"] {
        --ui-bg: #0b162a;           
        --ui-panel: #3280fd;        
        --ui-border-light: #006aff; 
        --ui-border-dark: #000000;  
        --ui-input: #02050a;        
        --ui-accent: #32f5ff;       
        --ui-text: #ffffff;
        --ui-olive-dark: #1d6ef8;
        --btn-grad: linear-gradient(to bottom, #254a7d 0%, #0a1a33 100%);
        --btn-play-grad: linear-gradient(to bottom, #00f2ff 0%, #0077ff 100%);
    }

    [data-theme="shucks"] {
        --ui-bg: #0d0b0b;           
        --ui-panel: #1a1515;        
        --ui-border-light: #4a0000; 
        --ui-border-dark: #000000;  
        --ui-input: #050000;        
        --ui-accent: #ff0000;       
        --ui-text: rgb(255, 255, 255);
        --ui-olive-dark: #ff00004b;       
        --btn-grad: linear-gradient(to bottom, #ff0000 0%, #4a0000 100%);
        --btn-play-grad: linear-gradient(to bottom, #ff0000 0%, #4a0000 100%);
    }

    /* Speed-blur effect for specific A-Train elements */
    [data-theme="atrain"] #activity-title {
        color: var(--ui-accent);
        text-shadow: 3px 0px 5px rgba(0, 242, 255, 0.4), -3px 0px 5px rgba(23, 105, 198, 0.4);
        letter-spacing: 2px;
        font-style: italic;
    }

    [data-theme="atrain"] .steam-btn-large {
        color: #000;
        box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        transition: transform 0.1s ease;
    }

    [data-theme="atrain"] .steam-btn-large:hover {
        transform: skewX(-10deg); 
    }

    /* Shucks Effects */
    [data-theme="shucks"] .entry-title,
    [data-theme="shucks"] #net-speed {
        text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
    }

    body {
        background-color: var(--ui-bg);
        color: var(--ui-text);
        font-family: "Tahoma", sans-serif; 
        margin: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        font-size: 11px;
        height: 100vh;
        overflow: hidden;
        transition: background-color 0.3s ease;
    }

    /* --- DASHBOARD WRAPPER SPLIT --- */
    .main-workspace {
        display: flex;
        gap: 10px;
        flex-grow: 1;
        overflow: hidden;
        margin-bottom: 45px;
    }

    .left-column {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        overflow: hidden;
    }

    /* Right Sidebar Console Layout */
    .right-sidebar {
        width: 260px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex-shrink: 0;
    }

    .sidebar-panel {
        background: var(--ui-panel);
        border: 1px solid var(--ui-border-dark);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        padding: 12px;
        box-sizing: border-box;
    }

    .panel-header {
        font-weight: bold;
        text-transform: uppercase;
        color: var(--ui-accent);
        letter-spacing: 1px;
        border-bottom: 1px solid var(--ui-border-light);
        padding-bottom: 4px;
        margin-bottom: 8px;
    }

    /* --- NETWORK AREA --- */
    .network-area {
        background: var(--ui-olive-dark);
        border: 1px solid var(--ui-border-dark);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-shrink: 0;
    }

    .graph-container {
        width: 300px;
        height: 50px;
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.05);
        position: relative;
        overflow: hidden;
    }

    .graph-line {
        position: absolute;
        bottom: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(193, 198, 173, 0.1) 21px);
        border-bottom: 2px solid var(--ui-accent);
        clip-path: polygon(0% 80%, 15% 40%, 30% 60%, 45% 20%, 60% 70%, 75% 30%, 90% 50%, 100% 40%, 100% 100%, 0% 100%);
    }

    /* --- ARCHIVE LIST LAYOUT --- */
    .archive-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
        flex-grow: 1;
        padding-right: 5px;
        opacity: 0;
        transition: opacity 0.5s ease;
    }

    .archive-entry {
        background: var(--ui-panel);
        border: 1px solid var(--ui-border-dark);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        padding: 8px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

     .archive-controls {
    background: var(--ui-panel);
    padding: 8px;
    border: 1px solid var(--ui-border-dark);
    border-top: 1px solid var(--ui-border-light);
    border-left: 1px solid var(--ui-border-light);
}

.archive-controls .steam-btn-classic {
    padding: 6px 12px;
}

    .entry-thumb { 
        width: 120px; 
        height: 45px; 
        object-fit: cover; 
        border: 1px solid #000; 
        flex-shrink: 0; 
    }

    .entry-info { 
        flex-grow: 1; 
    }

    .entry-title { 
        font-weight: bold; 
        color: #fff; 
        font-size: 13px; 
        margin: 0; 
    }

    .entry-status { 
        color: var(--ui-accent); 
        opacity: 0.7; 
        font-size: 10px; 
        text-transform: uppercase; 
    }

    .btn-play {
        background: var(--btn-play-grad);
        border: 1px solid var(--ui-border-dark);
        color: white;
        padding: 4px 20px;
        font-weight: bold;
        cursor: pointer;
        text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        flex-shrink: 0; 
    }

    /* SYSTEM STATUS QUICK LIST CSS */
    .system-log {
        font-family: monospace;
        font-size: 10px;
        color: var(--ui-text);
        line-height: 1.5;
    }

    /* --- JunoDev's PICKS WIDGET STYLING --- */
    .pick-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .pick-media-box {
        display: flex;
        gap: 10px;
        background: rgba(0,0,0,0.2);
        padding: 8px;
        border: 1px solid var(--ui-border-dark);
    }
    .pick-poster {
        width: 70px;
        height: 100px;
        object-fit: cover;
        border: 1px solid #000;
        background: #222;
        flex-shrink: 0;
    }
    .pick-details {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }
    .pick-title {
        font-size: 12px;
        font-weight: bold;
        color: #fff;
        margin: 0 0 2px 0;
    }
    .pick-creator {
        font-size: 10px;
        color: var(--ui-accent);
        margin: 0 0 6px 0;
        text-transform: uppercase;
        opacity: 0.8;
    }
    .pick-desc {
        font-size: 10px;
        line-height: 1.3;
        margin: 0;
        overflow-y: auto;
        max-height: 52px;
    }
    .admin-edit-panel {
        background: rgba(0,0,0,0.4);
        padding: 8px;
        border: 1px solid var(--ui-border-dark);
        margin-top: 5px;
        display: none; /* Controlled via script authorization validation */
    }

    /* --- INTRO & OVERLAYS --- */
    #intro-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 9999; background: black; display: flex;
        align-items: center; justify-content: center; overflow: hidden;
    }

    .terminal-text {
        font-family: "Courier New", Courier, monospace;
        color: var(--ui-accent);
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 0 0 8px rgba(193, 198, 173, 0.6);
        animation: flicker 2s infinite;
        text-align: center;
    }

    .steam-btn-classic {
        background: var(--btn-grad);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        border-right: 1px solid var(--ui-border-dark);
        border-bottom: 1px solid var(--ui-border-dark);
        color: var(--ui-text);
        font-family: "Tahoma", sans-serif;
        font-size: 10px;
        font-weight: bold;
        padding: 6px 14px;
        cursor: pointer;
    }

    /* --- FOOTER & INPUTS --- */
    .footer-bar {
        position: fixed; bottom: 0; left: 0; right: 0; height: 35px;
        background: var(--ui-panel);
        border-top: 1px solid var(--ui-border-light);
        display: flex; align-items: center; padding: 0 20px; gap: 20px;
    }

    .progress-container {
        flex-grow: 1; height: 10px;
        background: var(--ui-input);
        border: 1px solid var(--ui-border-dark);
        position: relative;
    }

    #sync-progress {
        width: 0%; height: 100%;
        background: var(--ui-accent);
        transition: width 0.1s linear;
    }

    .steam-input {
        background: var(--ui-input);
        border: 1px solid var(--ui-border-dark);
        color: var(--ui-accent);
        padding: 6px 10px; width: 100%; outline: none; margin-bottom: 10px;
        box-sizing: border-box;
    }

    /* SCROLLBARS */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: var(--ui-input); }
    ::-webkit-scrollbar-thumb { 
        background: var(--ui-panel); 
        border: 1px solid var(--ui-border-dark); 
    }

    @keyframes flicker { 0%, 100% { opacity: 1; } 92% { opacity: 1; } 94% { opacity: 0.6; } 98% { opacity: 0.3; } }
</style>
</head>

        function renderArchives() {
            const list = document.getElementById('archive-list');
            list.innerHTML = archives.map(item => `
                <div class="archive-entry">
                    <img src="${item.img}" class="entry-thumb">
                    <div class="entry-info">
                        <p class="entry-title">${item.title}</p>
                        <p class="entry-status">${item.status}</p>
                    </div>
                    <button onclick="window.location.href='${item.url}'" class="btn-play">PLAY</button>
                </div>
            `).join('');
        }

        function simulateSync() {
            let progress = 0;
            const bar = document.getElementById('sync-progress');
            const label = document.getElementById('sync-label');
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    label.innerText = "Sync Complete";
                    document.getElementById('archive-list').style.opacity = "1";
                    renderArchives();
                }
                bar.style.width = progress + "%";
                if (progress > 10 && progress < 90) label.innerText = "Syncing Archives...";
            }, 40);
        }

function filterCategory(cat) {
    const entries = document.getElementsByClassName('archive-entry');
    const data = archives; // The array defined in your script
    
    // Refresh the list with the specific category
    const list = document.getElementById('archive-list');
    const filtered = (cat === 'all') ? data : data.filter(item => item.category === cat);
    
    list.innerHTML = filtered.map(item => `
        <div class="archive-entry">
            <img src="${item.img}" class="entry-thumb">
            <div class="entry-info">
                <p class="entry-title">${item.title}</p>
                <p class="entry-status">${item.status}</p>
            </div>
            <button onclick="window.location.href='${item.url}'" class="btn-play">PLAY</button>
        </div>
    `).join('');
}

 
        window.onload = () => {
            simulateSync();
            setInterval(updateLiveStats, 2000);
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('intro-overlay')) skipIntro();

            if (e.key === 'F2' && document.getElementById('intro-overlay')) {
                skipIntro();
            }
        });

        function updateLiveStats() {
            const speed = (Math.random() * (3.5 - 2.1) + 2.1).toFixed(1);
            document.getElementById('net-speed').innerText = `${speed} MB/S`;
        }

        function filterArchives() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let entries = document.getElementsByClassName('archive-entry');
            for (let i = 0; i < entries.length; i++) {
                let title = entries[i].querySelector('.entry-title').innerText.toLowerCase();
                entries[i].style.display = title.includes(input) ? "flex" : "none";
            }
        }
        
        window.addEventListener('message', (event) => {
            if (event.data.type === 'THEME_UPDATE') {
                document.documentElement.setAttribute('data-theme', event.data.theme);
                localStorage.setItem('jayraffe-theme', event.data.theme);
            }
        });

        (function() {
            const saved = localStorage.getItem('jayraffe-theme') || 'steam';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
