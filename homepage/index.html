<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../styles.css">
    <script src="../global.js"></script>
    
    <title>Jayraffe Complex | Archives</title>

    <style>
    :root {
        /* STEAM CLASSIC (Default Colors) */
        --ui-bg: #38413a;
        --ui-panel: #4b564d;
        --ui-border-light: #5d6a60;
        --ui-border-dark: #2a322c;
        --ui-input: #2a322c;
        --ui-text: #d1d1d1;
        --ui-accent: #c1c6ad;
        --ui-olive-dark: #3d463f;
        --btn-grad: linear-gradient(to bottom, #75826b 0%, #5a6651 100%);
        --btn-play-grad: linear-gradient(to bottom, #a4ad8d 0%, #6b7754 100%);
    }

    /* THEME: INVINCIBLE (GDA Colors) */
    [data-theme="invincible"] {
       --ui-bg: #ffd325;           /* Deep Black base */
        --ui-panel: #17a8f6;        /* Dark Grey panels */
        --ui-border-light: #2563eb; /* Suit Blue Piping */
        --ui-border-dark: #000000;  
        --ui-input: #000000;        
        --ui-accent: #ffffff;       /* Electric Yellow (Gloves/Logo) */
        --ui-text: #ffffff;
        --ui-olive-dark: #101827;
        --btn-grad: linear-gradient(to bottom, #1e3a8a 0%, #16213e 100%);
        --btn-play-grad: linear-gradient(to bottom, #3b82f6 0%, #1e3a8a 100%);
    }

    [data-theme="atrain"] {
    --ui-bg: #0b162a;           /* Deep midnight blue base */
    --ui-panel: #3280fd;        /* Vought-tech navy panels */
    --ui-border-light: #006aff; /* Electric blue piping */
    --ui-border-dark: #000000;  
    --ui-input: #02050a;        
    --ui-accent: #32f5ff;       /* Compound-V Cyan Glow */
    --ui-text: #ffffff;
    --ui-olive-dark: #1d6ef8;
    --btn-grad: linear-gradient(to bottom, #254a7d 0%, #0a1a33 100%);
    --btn-play-grad: linear-gradient(to bottom, #00f2ff 0%, #0077ff 100%);
    }

    /* Speed-blur effect for specific A-Train elements */
    [data-theme="atrain"] #activity-title {
        color: var(--ui-accent);
        text-shadow: 3px 0px 5px rgba(0, 242, 255, 0.4), -3px 0px 5px rgba(23, 105, 198, 0.4);
        letter-spacing: 2px;
        font-style: italic;
    }

    [data-theme="atrain"] .steam-btn-large {
        color: #000;
        box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        transition: transform 0.1s ease;
    }

    [data-theme="atrain"] .steam-btn-large:hover {
        transform: skewX(-10deg); /* Gives it a "moving fast" look */
    }

    [data-theme="atrain"] .steam-window {
        background-image: radial-gradient(circle at 50% 50%, rgba(22, 57, 107, 0.1) 0%, transparent 80%);
    }

    [data-theme="shucks"] {
        /* SHUCKS / VOID CORRUPTION MODE */
        --ui-bg: #0d0b0b;           /* Darker, almost reddish-black */
        --ui-panel: #1a1515;        /* Dark wood/rust panel */
        --ui-border-light: #4a0000; /* Dried blood border */
        --ui-border-dark: #000000;  
        --ui-input: #050000;        /* Deep void pits */
        --ui-accent: #ff0000;       /* Glitch Red / Blood */
        --ui-text: rgb(255, 255, 255);
        --ui-olive-dark: #ff00004b;       /* Ash grey text */
        --btn-grad-top: #3d0000;    /* Crimson gradient top */
        --btn-grad: linear-gradient(to bottom, #ff0000 0%, #4a0000 100%);
        --btn-play-grad: linear-gradient(to bottom, #ff0000 0%, #4a0000 100%);
    }

    /* Specific Shucks Flare: Adding a blood-red glow to the accent text */
    [data-theme="shucks"] #activity-tags, 
    [data-theme="shucks"] #activity-title {
        color: #ff0000;
        text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }

    body {
        background-color: var(--ui-bg);
        color: var(--ui-text);
        font-family: "Tahoma", sans-serif; 
        margin: 0;
        padding: 10px;
        display: flex;
        flex-direction: column;
        font-size: 11px;
        height: 100vh;
        overflow: hidden;
        transition: background-color 0.3s ease;
    }

    /* --- NETWORK AREA --- */
    .network-area {
        background: var(--ui-olive-dark);
        border: 1px solid var(--ui-border-dark);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-shrink: 0;
    }

    .graph-container {
        width: 300px;
        height: 50px;
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.05);
        position: relative;
        overflow: hidden;
    }

    .graph-line {
        position: absolute;
        bottom: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(193, 198, 173, 0.1) 21px);
        border-bottom: 2px solid var(--ui-accent);
        clip-path: polygon(0% 80%, 15% 40%, 30% 60%, 45% 20%, 60% 70%, 75% 30%, 90% 50%, 100% 40%, 100% 100%, 0% 100%);
    }

    /* --- ARCHIVE LIST LAYOUT (The fix is here) --- */
    .archive-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
        flex-grow: 1;
        margin-bottom: 45px;
        padding-right: 5px;
        opacity: 0;
        transition: opacity 0.5s ease;
    }

    .archive-entry {
        background: var(--ui-panel);
        border: 1px solid var(--ui-border-dark);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        padding: 8px;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .entry-thumb { 
        width: 120px; 
        height: 45px; 
        object-fit: cover; 
        border: 1px solid #000; 
        flex-shrink: 0; 
    }

    .entry-info { 
        flex-grow: 1; /* This pushes the PLAY button to the right */
    }

    .entry-title { 
        font-weight: bold; 
        color: #fff; 
        font-size: 13px; 
        margin: 0; 
    }

    .entry-status { 
        color: var(--ui-accent); 
        opacity: 0.7; 
        font-size: 10px; 
        text-transform: uppercase; 
    }

    .btn-play {
        background: var(--btn-play-grad);
        border: 1px solid var(--ui-border-dark);
        color: white;
        padding: 4px 20px;
        font-weight: bold;
        cursor: pointer;
        text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        flex-shrink: 0; /* Prevents the button from being squashed */
    }

    /* --- INTRO & OVERLAYS --- */
    #intro-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 9999; background: black; display: flex;
        align-items: center; justify-content: center; overflow: hidden;
    }

    .terminal-text {
        font-family: "Courier New", Courier, monospace;
        color: var(--ui-accent);
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 0 0 8px rgba(193, 198, 173, 0.6);
        animation: flicker 2s infinite;
        text-align: center;
    }

    .steam-btn-classic {
        background: var(--btn-grad);
        border-top: 1px solid var(--ui-border-light);
        border-left: 1px solid var(--ui-border-light);
        border-right: 1px solid var(--ui-border-dark);
        border-bottom: 1px solid var(--ui-border-dark);
        color: var(--ui-text);
        font-family: "Tahoma", sans-serif;
        font-size: 10px;
        font-weight: bold;
        padding: 6px 14px;
        cursor: pointer;
    }

    /* --- FOOTER & INPUTS --- */
    .footer-bar {
        position: fixed; bottom: 0; left: 0; right: 0; height: 35px;
        background: var(--ui-panel);
        border-top: 1px solid var(--ui-border-light);
        display: flex; align-items: center; padding: 0 20px; gap: 20px;
    }

    .progress-container {
        flex-grow: 1; height: 10px;
        background: var(--ui-input);
        border: 1px solid var(--ui-border-dark);
        position: relative;
    }

    #sync-progress {
        width: 0%; height: 100%;
        background: var(--ui-accent);
        transition: width 0.1s linear;
    }

    .steam-input {
        background: var(--ui-input);
        border: 1px solid var(--ui-border-dark);
        color: var(--ui-accent);
        padding: 6px 10px; width: 100%; outline: none; margin-bottom: 10px;
    }

    /* SCROLLBARS */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: var(--ui-input); }
    ::-webkit-scrollbar-thumb { 
        background: var(--ui-panel); 
        border: 1px solid var(--ui-border-dark); 
    }

    @keyframes flicker { 0%, 100% { opacity: 1; } 92% { opacity: 1; } 94% { opacity: 0.6; } 98% { opacity: 0.3; } }
</style>
</head>
<body>

   <div id="intro-overlay">
        <video id="intro-video" style="width: 100%; height: 100%; object-fit: cover;">
           <source src="../assets/videos/ShuckIntro.mp4" type="video/mp4">
        </video>
        
        <button onclick="skipIntro()" class="steam-btn-classic" style="position: absolute; bottom: 40px; right: 40px; z-index: 10000;">

    <div class="network-area">

        <div class="progress-container">

    </div>

    <script>
        // ... (Your existing archive array and simulation functions stay the same) ...
        const archives = [
            { title: "Archive.org", status: 'Ready to Enter', img: '../assets/images/ArchiveOrgThumbnail.png', url: 'https://archive.org/' },
            { title: "Baldi's Basics", status: 'Ready to Play', img: '../assets/images/Baldi.webp', url: '../experience/?id=baldibasics' },
            { title: "Baldi's Basics: -B", status: 'Ready to Play', img: '../assets/images/Baldi.webp', url: '../experience/?id=minusb' },//

            { title: 'Henry Stickmin: Stealing the Diamond', status: 'Ready to Play', img: '../assets/images/StDRTitle.webp', url: '../experience?id=hsdiamond' },

            { title: 'Minecraft Skin Library', status: 'Ready to Play', img: '../assets/images/mc.avif', url: 'https://minecraft.novaskin.me/menu' },
            { title: 'Moonpie (You need to sign up at home to use this.)', status: 'Ready to Play', img: '../assets/images/HL1Thumbnail.jpg', url: 'https://sites.google.com/view/moonpie/home' },
            { title: "Papa's Donuteria", status: 'Ready to Play', img: '../assets/images/PapasDonuteria.jpg', url: '../experience?id=donuteria' },
            { title: "Pizza Tower", status: 'Ready to Play', img: '../assets/images/PT.jpg', url: '../experience?id=pizzatower' },
            { title: 'Roblox', status: 'Ready to Play (Experimental, could be blocked.)', img: '../assets/images/HL1Thumbnail.jpg', url: 'https://nowgg.lol/apps/a/19900/b.html' },
            { title: 'Team Fortress 2', status: 'Update Required (Windows only.)', img: '../assets/images/tf2.jpg', url: 'https://archive.org/download/mjayraffecomplexdirect/Team%20Fortress%202.7z' }, 
            { title: 'ULTRAKILL', status: 'Coming Soon..', img: '../assets/images/UltrakillThumbnail.jpg', url: '' },
        ];

        const introOverlay = document.getElementById('intro-overlay');
        const introVideo = document.getElementById('intro-video');

        // Replace your current startIntro and showUplinkPrompt with this:

function startIntro() {
    const video = document.getElementById('intro-video');
    const overlay = document.getElementById('intro-overlay');

    if (!video) return;

    // Force it to try and play
    const playPromise = video.play();

    if (playPromise !== undefined) {
        playPromise.catch(() => {
            console.log("Autoplay blocked. Showing prompt...");
            showUplinkPrompt(overlay, video);
        });
    }
}

function showUplinkPrompt(overlay, video) {
    if (document.getElementById('play-prompt')) return;

    // Inject the HTML
    overlay.insertAdjacentHTML('beforeend', `
        <div id="play-prompt" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10001; text-align: center; cursor: pointer; width: 100%;">
            <div class="terminal-text" style="font-size: 24px; color: var(--ui-accent); font-family: 'Courier New', monospace;">[ ACCESS RESTRICTED ]</div>
            <p class="terminal-text" style="font-size: 11px; margin-top: 15px; opacity: 0.8; color: var(--ui-accent); font-family: 'Courier New', monospace;">
                Click to Initialize Uplink
            </p>
        </div>
    `);

    const prompt = document.getElementById('play-prompt');
    prompt.onclick = function() {
        this.remove();
        video.muted = false;
        video.volume = 1.0;
        video.play();
        video.onended = skipIntro;
    };
}
        function skipIntro() {
            introVideo.pause();
            introOverlay.style.transition = "opacity 0.8s ease";
            introOverlay.style.opacity = "0";
            setTimeout(() => introOverlay.remove(), 800);
        }

    (function() {
    const autoSkip = localStorage.getItem('auto-skip-intro') === 'true';
    const video = document.getElementById('intro-video');
    const videoSource = video.querySelector('source');
                                                                                                                        
    if (autoSkip) {
        skipIntro();
        console.log("Jayraffe Complex // Intro bypassed by user preference.");
    } else {
        // --- MULTI-CHANCE RARE INTRO LOGIC ---
        // Roll 1 to 100 for more granular control (1% chances)
        const roll = Math.floor(Math.random() * 100) + 1; 
        
        let rareVideo = null;

        if (roll <= 5) { 
            // 5% chance (Rolls 1-5)
            rareVideo = "../assets/videos/HungryForKarma.mp4";
        } else if (roll === 6) { 
            // 1% chance (The "Ultra Rare" roll)
            rareVideo = "../assets/videos/Starlight.mp4";
        } else if (roll > 95) {
            // 5% chance (Rolls 96-100)
            rareVideo = "../assets/videos/Karol.mp4";
        }

        if (rareVideo) {
            console.log(`RARE EVENT: Loading ${rareVideo}`);
            videoSource.src = rareVideo;
            video.load(); 
        }
        // -------------------------------------

        if (video) {
            video.play().catch(e => {
                console.log("Autoplay blocked: Triggering Uplink Prompt.");
                showUplinkPrompt(document.getElementById('intro-overlay'), video);
            });
            video.onended = skipIntro;
        }
    }
})();
        // Standard helpers
        function renderArchives() {
            const list = document.getElementById('archive-list');
            list.innerHTML = archives.map(item => `
                <div class="archive-entry">
                    <img src="${item.img}" class="entry-thumb">
                    <div class="entry-info">
                        <p class="entry-title">${item.title}</p>
                        <p class="entry-status">${item.status}</p>
                    </div>
                    <button onclick="window.location.href='${item.url}'" class="btn-play">PLAY</button>
                </div>
            `).join('');
        }

        function simulateSync() {
            let progress = 0;
            const bar = document.getElementById('sync-progress');
            const label = document.getElementById('sync-label');
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    label.innerText = "Sync Complete";
                    document.getElementById('archive-list').style.opacity = "1";
                    renderArchives();
                }
                bar.style.width = progress + "%";
                if (progress > 10 && progress < 90) label.innerText = "Syncing Archives...";
            }, 80);
        }

        window.onload = () => {
            simulateSync();
            startIntro();
            setInterval(updateLiveStats, 2000);
        };

        // Esc Key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('intro-overlay')) skipIntro();
        });

        // Other UI logic...
        function updateLiveStats() {
            const speed = (Math.random() * (3.5 - 2.1) + 2.1).toFixed(1);
            document.getElementById('net-speed').innerText = `${speed} MB/S`;
        }

        function filterArchives() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let entries = document.getElementsByClassName('archive-entry');
            for (let i = 0; i < entries.length; i++) {
                let title = entries[i].querySelector('.entry-title').innerText.toLowerCase();
                entries[i].style.display = title.includes(input) ? "flex" : "none";
            }
        }
        

      window.addEventListener('message', (event) => {
    // Only accept messages that look like our theme updates
    if (event.data.type === 'THEME_UPDATE') {
        // This applies the theme to the <html> tag of the sub-page
        document.documentElement.setAttribute('data-theme', event.data.theme);
        
        // Also save it locally so if the iframe refreshes, it stays correct
        localStorage.setItem('jayraffe-theme', event.data.theme);
    }
});

// Check on initial load
(function() {
    const saved = localStorage.getItem('jayraffe-theme') || 'steam';
    document.documentElement.setAttribute('data-theme', saved);
})();

    </script>
